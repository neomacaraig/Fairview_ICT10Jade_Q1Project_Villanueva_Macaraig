<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fairview_ICT10Jade_Q1SkillsTest_Macaraig_Villanueva</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0f0f0f;
            color: #f5f5f5;
            font-family: 'Quicksand', sans-serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        navbar {
            width: 100%;
            background-color: #171717;
            border-bottom: 2px solid #00704a;
            padding: 15px 30px;
            display: flex;
            justify-content: center;
        }
        .nav-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            gap: 25px;
        }
        .nav-link {
            font-family: 'Fredoka', sans-serif;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }
        .nav-link.active {
            color: #00ff9d;
        }
        .nav-link.inactive {
            color: #a3a3a3;
        }
        .nav-link:hover {
            color: #00b074;
        }
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            height: calc(100vh - 80px);
            padding: 20px 0;
            margin-top: 10px;
        }
        .left-panel {
            width: 70%;
            background: linear-gradient(145deg, #241812, #1a100b);
            border: 2px solid #00704a;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }
        .right-panel {
            width: 30%;
            background-color: #171717;
            border: 2px solid #3d2314;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1, h3 {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 0.5px;
        }
        h1 {
            color: #00704a;
            margin-top: 0;
            font-size: 28px;
        }
        h3 {
            color: #00b074;
            font-size: 18px;
            margin-bottom: 8px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #00704a;
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            color: #d1d1d1;
            font-weight: 600;
        }
        select, input[type="text"], input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00704a;
            background-color: #120b08;
            color: white;
            width: 100%;
            margin-top: 6px;
            margin-bottom: 15px;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
        }
        button {
            font-family: 'Fredoka', sans-serif;
            background-color: #00704a;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #005c3c;
        }
        #show {
            background-color: #0f0f0f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3d2314;
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #00ff9d;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
        }
        .footer-note {
            font-size: 13px;
            color: #00ff9d;
            font-weight: 600;
            text-align: center;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed #00704a;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <navbar> 
        <div class="nav-container">
            <a href="index.html" class="nav-link inactive">☕ Drinks Order</a>
            <a href="page2.html" class="nav-link active">📊 SKU Generator</a>
        </div>
    </navbar>
    <div class="main-container">
        <!-- SKU inputs section (70%) -->
        <div class="left-panel">
            <div>
                <h1>📊 Stock SKU Generator</h1>
                <hr>

                <label><strong>Category:</strong></label>
                <select id="category_id">
                    <option value="Espresso">Espresso Drinks</option>
                    <option value="Frappuccino">Frappuccino Blended</option>
                    <option value="ColdBrew">Cold Brew Coffee</option>
                    <option value="Bakery">Bakery & Pastries</option>
                </select>

                <label><strong>Product Name:</strong></label>
                <input type="text" id="prod_name_id" placeholder="e.g., Mango Dragonfruit Lemonade Refresher">

                <label><strong>Stock Quantity:</strong></label>
                <input type="number" id="stock_qty_id" value="10" min="0">

                <button type="button" py-click="generate_sku">Generate SKU Code</button>
            </div>

            <div class="footer-note">
                 Inspiration taken from Starbucks :D
                  <br>
                 Prince Villanueva, Neo Macaraig-10Jade
            </div>
        </div>

        <div class="right-panel">
            <div>
                <h3>Generated Code</h3>
                <hr style="background: #3d2314;">
            </div>
            
            <div id="show">Your generated SKU will appear here.</div>

            <div style="height: 45px;"></div>
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
